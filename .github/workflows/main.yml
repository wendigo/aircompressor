name: GC cutoff evidence

on:
  push:
    branches:
      - gc-evidence/pr396-2386b7c

permissions:
  contents: read
  statuses: write

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_HEAD: 2386b7cc1dd7ddc91e9d3707bd6ee6f48f731abd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compare current and proposed limits without running the test suite
        run: python3 .gc-evidence/run.py
      - name: Upload raw logs, environment, patch, and summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gc-cutoff-evidence
          path: gc-evidence-results/
          retention-days: 30
      - name: Report completion on the PR source commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_JOB_STATUS: ${{ job.status }}
          EVIDENCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EVIDENCE_STATE=failure
          if [ "$EVIDENCE_JOB_STATUS" = success ]; then
            EVIDENCE_STATE=success
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_HEAD}" \
            -f "state=$EVIDENCE_STATE" \
            -f context=gc-cutoff-evidence \
            -f "target_url=$EVIDENCE_RUN_URL" \
            -f 'description=GC cutoff comparison; raw logs and summary in run artifacts'
